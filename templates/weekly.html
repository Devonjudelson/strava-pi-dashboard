<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weekly Mileage | Strava Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="dashboard">
        <nav class="dashboard-nav">
            <a href="/">Today</a>
            <a href="/weekly" class="active">Weekly</a>
            <a href="/shoes">Shoes</a>
        </nav>

        <header class="dashboard-header">
            <div>
                <p
                    class="eyebrow"
                    id="chart-eyebrow"
                >
                    TRAINING HISTORY
                </p>

                <h1 id="weekly-chart-title">
                    Last 10 Weeks
                </h1>

                <p id="weekly-chart-subtitle">
                    Select a week to see its daily breakdown.
                </p>
            </div>

            <button
                type="button"
                id="back-to-weeks"
                class="back-to-weeks"
                hidden
            >
                ← All weeks
            </button>
        </header>

        <section class="run-card">
            <div
                id="weekly-summary"
                class="weekly-summary"
            >
                <div>
                    <span class="metric-label">
                        10-week average
                    </span>

                    <strong>--</strong>
                </div>

                <div>
                    <span class="metric-label">
                        Highest week
                    </span>

                    <strong>--</strong>
                </div>
            </div>
            

            <div class="weekly-chart-wrapper">
                <canvas
                    id="weekly-mileage-chart"
                    aria-label="Weekly mileage chart"
                    role="img"
                ></canvas>
            </div>

            <p
                id="weekly-status"
                class="status-message"
                aria-live="polite"
            >
                Loading weekly mileage...
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"
></script>

    <script
        src="{{ url_for('static', filename='js/weekly.js') }}"
    ></script>
</body>
</html>
